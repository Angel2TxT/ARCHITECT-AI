<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHITECT | Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=44" />
  <style id="loader-critical">
    body.app-loading { overflow: hidden; }
    #appLoader.app-loader--visible {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      opacity: 1 !important;
      visibility: visible !important;
    }
    html.dark #appLoader.app-loader--visible { background: #000; }
    #appLoader .app-loader-spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: #000;
      border-radius: 50%;
      animation: plano-loader-spin 0.7s linear infinite;
    }
    html.dark #appLoader .app-loader-spinner {
      border-color: rgba(255, 255, 255, 0.15);
      border-top-color: #fff;
    }
    @keyframes plano-loader-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var KEY = "plano_ia_theme";
      var dark = localStorage.getItem(KEY) === "dark";
      var root = document.documentElement;
      root.classList.remove("light", "dark");
      root.classList.add(dark ? "dark" : "light");
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body class="auth-page app-loading">
  <div id="appLoader" class="app-loader app-loader--visible" role="status" aria-live="polite" aria-busy="true">
    <div class="app-loader-inner">
      <p class="app-loader-brand">ARCHITECT</p>
      <div class="app-loader-spinner" aria-hidden="true"></div>
      <p class="app-loader-text" id="appLoaderText">Cargando...</p>
    </div>
  </div>
  <script src="/static/loader-bootstrap.js?v=1"></script>

  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg-pattern"></div>
  </div>

  <main class="auth-shell">
    <div class="auth-card glass-panel">
      <header class="auth-header">
        <p class="auth-kicker">ARCHITECT · Studio</p>
        <h1 class="auth-title">ARCHITECT</h1>
        <p class="auth-subtitle">Revisa planos con IA y normativa de referencia</p>
      </header>

      <div class="auth-tabs" role="tablist" id="authTabs">
        <span class="auth-tab-indicator" id="authTabIndicator" aria-hidden="true"></span>
        <button type="button" class="auth-tab active" data-tab="login" role="tab" aria-selected="true">
          Iniciar sesión
        </button>
        <button type="button" class="auth-tab" data-tab="register" role="tab" aria-selected="false">
          Registrarse
        </button>
      </div>

      <div class="auth-panels" id="authPanels" data-tab="login">
        <form id="loginForm" class="auth-panel auth-panel--active" autocomplete="on">
          <div class="auth-field">
            <label for="loginEmail">Correo electrónico</label>
            <input
              type="email"
              id="loginEmail"
              class="auth-input"
              required
              autocomplete="email"
              placeholder="tu@correo.com"
            />
          </div>
          <div class="auth-field">
            <label for="loginPassword">Contraseña</label>
            <div class="auth-input-wrap">
              <input
                type="password"
                id="loginPassword"
                class="auth-input"
                required
                autocomplete="current-password"
                placeholder="••••••••"
              />
              <button type="button" class="auth-toggle-pw" data-target="loginPassword" aria-label="Mostrar contraseña">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
          <p id="loginError" class="auth-error hidden" role="alert"></p>
          <button type="submit" class="auth-submit btn-primary">
            Entrar
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </form>

        <form id="registerForm" class="auth-panel" autocomplete="on" hidden>
          <div class="auth-field">
            <label for="regName">Nombre (opcional)</label>
            <input
              type="text"
              id="regName"
              class="auth-input"
              autocomplete="name"
              placeholder="Tu nombre"
            />
          </div>
          <div class="auth-field">
            <label for="regEmail">Correo electrónico</label>
            <input
              type="email"
              id="regEmail"
              class="auth-input"
              required
              autocomplete="email"
              placeholder="tu@correo.com"
            />
          </div>
          <div class="auth-field">
            <label for="regPassword">Contraseña</label>
            <div class="auth-input-wrap">
              <input
                type="password"
                id="regPassword"
                class="auth-input"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Mínimo 8 caracteres"
              />
              <button type="button" class="auth-toggle-pw" data-target="regPassword" aria-label="Mostrar contraseña">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
          <p id="regError" class="auth-error hidden" role="alert"></p>
          <button type="submit" class="auth-submit btn-primary">
            Crear cuenta
            <span class="material-symbols-outlined">person_add</span>
          </button>
          <p class="auth-footnote">Plan Gratis: 5 análisis al mes con modelo demo.</p>
          <p class="auth-demo-hint">Demo admin: <code>admin@planoia.com</code> / <code>admin123</code></p>
        </form>
      </div>

      <div id="dbStatus" class="auth-db-warn hidden" role="status"></div>
    </div>

    <p class="auth-back">
      <a href="/">← Volver al inicio</a>
    </p>
  </main>

  <script src="/static/auth.js?v=22"></script>
  <script>
    document.querySelectorAll(".auth-toggle-pw").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        const icon = btn.querySelector(".material-symbols-outlined");
        if (icon) icon.textContent = show ? "visibility_off" : "visibility";
      });
    });

    (function initAuthTabs() {
      const tabsEl = document.getElementById("authTabs");
      const indicator = document.getElementById("authTabIndicator");
      const panelsEl = document.getElementById("authPanels");
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      if (!tabsEl || !indicator || !panelsEl || !loginForm || !registerForm) return;

      let currentTab = "login";
      let animating = false;

      function syncIndicator(tab) {
        indicator.classList.toggle("auth-tab-indicator--register", tab === "register");
      }

      function panelHeight(el) {
        return el.offsetHeight;
      }

      function setPanelsHeight(px) {
        panelsEl.style.height = px ? px + "px" : "";
      }

      function hidePanel(panel) {
        panel.classList.remove(
          "auth-panel--active",
          "auth-panel--exit-left",
          "auth-panel--exit-right",
          "auth-panel--enter-left",
          "auth-panel--enter-right"
        );
        panel.hidden = true;
      }

      function switchTab(tab) {
        if (tab === currentTab || animating) return;
        const toRegister = tab === "register";
        const outgoing = toRegister ? loginForm : registerForm;
        const incoming = toRegister ? registerForm : loginForm;

        animating = true;
        document.querySelectorAll(".auth-tab").forEach((b) => {
          const on = b.dataset.tab === tab;
          b.classList.toggle("active", on);
          b.setAttribute("aria-selected", on ? "true" : "false");
        });
        syncIndicator(tab);
        panelsEl.dataset.tab = tab;
        document.getElementById("loginError")?.classList.add("hidden");
        document.getElementById("regError")?.classList.add("hidden");

        outgoing.classList.remove("auth-panel--active");
        outgoing.classList.add(toRegister ? "auth-panel--exit-left" : "auth-panel--exit-right");

        incoming.hidden = false;
        incoming.classList.add(
          "auth-panel--active",
          toRegister ? "auth-panel--enter-right" : "auth-panel--enter-left"
        );
        setPanelsHeight(panelHeight(incoming));

        requestAnimationFrame(() => {
          incoming.classList.remove("auth-panel--enter-right", "auth-panel--enter-left");
        });

        const duration = 380;
        window.setTimeout(() => {
          hidePanel(outgoing);
          currentTab = tab;
          setPanelsHeight(panelHeight(incoming));
          animating = false;
        }, duration);
      }

      syncIndicator("login");
      setPanelsHeight(panelHeight(loginForm));
      window.addEventListener("resize", () => {
        const active = currentTab === "login" ? loginForm : registerForm;
        if (!active.hidden) setPanelsHeight(panelHeight(active));
      });

      document.querySelectorAll(".auth-tab").forEach((btn) => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
      });

      if (window.location.hash === "#register") switchTab("register");
    })();

    fetch("/api/health")
      .then((r) => r.json())
      .then((h) => {
        if (h.ok) return;
        const el = document.getElementById("dbStatus");
        if (!el) return;
        el.classList.remove("hidden");
        el.textContent =
          "MySQL no conectado. Enciende el servicio, crea la base plano_ia y ejecuta: python scripts/init_db.py";
      })
      .catch(() => {});
  </script>
</body>
</html>
