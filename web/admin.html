<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración · ARCHITECT</title>
  <link rel="icon" type="image/png" href="/static/brand/architect-icon.png?v=3" />
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png?v=3" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=115" />
  <script>
    (function () {
      var KEY = "plano_ia_theme";
      var saved = localStorage.getItem(KEY);
      if (saved !== "light" && saved !== "dark") {
        saved = "light";
        localStorage.setItem(KEY, saved);
      }
      var dark = saved === "dark";
      var root = document.documentElement;
      root.classList.remove("light", "dark");
      root.classList.add(dark ? "dark" : "light");
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body class="admin-shell-page">
  <aside class="admin-sidebar" id="adminSidebar" aria-label="Módulos de administración"></aside>

  <main class="admin-main-pane">
    <header class="admin-topbar">
      <div class="admin-topbar-crumb">
        <span class="material-symbols-outlined">deployed_code</span>
        <span class="admin-topbar-sep">/</span>
        <strong id="adminBreadcrumb">Administración</strong>
      </div>
      <button type="button" class="admin-refresh-btn" id="btnAdminRefresh">
        <span class="material-symbols-outlined">refresh</span>
        Actualizar
      </button>
    </header>

    <div class="admin-content" id="adminContent">
      <p id="adminStatus" class="admin-status">Cargando panel…</p>
      <p id="adminError" class="admin-error-banner hidden" role="alert"></p>
      <div class="admin-content-inner">
        <div id="adminSectionRoot"></div>
      </div>
    </div>
  </main>

  <dialog class="admin-modal" id="adminModal" aria-labelledby="adminModalTitle">
    <form method="dialog" class="admin-modal-box" id="adminModalForm">
      <header class="admin-modal-head">
        <h2 id="adminModalTitle">Detalle</h2>
        <button type="button" class="admin-modal-close" id="adminModalClose" aria-label="Cerrar">
          <span class="material-symbols-outlined">close</span>
        </button>
      </header>
      <div class="admin-modal-body" id="adminModalBody"></div>
      <footer class="admin-modal-foot" id="adminModalFoot"></footer>
    </form>
  </dialog>

  <script src="/static/auth.js?v=28"></script>
  <script src="/static/dialogs.js?v=4"></script>
  <script src="/static/admin.js?v=17"></script>
</body>
</html>
