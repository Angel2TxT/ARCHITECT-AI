services:
  mysql:
    image: mysql:8.0
    container_name: architect-mysql
    environment:
      MYSQL_DATABASE: architect
      MYSQL_USER: architect
      MYSQL_PASSWORD: architect_pass
      MYSQL_ROOT_PASSWORD: architect_root
    ports:
      - "3307:3306"
    volumes:
      - architect_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-parchitect_root"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: architect-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://architect:architect_pass@mysql:3306/architect?charset=utf8mb4
      ADMIN_EMAIL: admin@architect.local
      ADMIN_PASSWORD: admin123
      # Solo correos/OAuth/Stripe; el checkout demo usa rutas relativas (/checkout).
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ARCHITECT}
      BILLING_MODE: ${BILLING_MODE:-demo}
      BILLING_CHECKOUT_TTL_MINUTES: ${BILLING_CHECKOUT_TTL_MINUTES:-45}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-mxn}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-off}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: python scripts/docker_start.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: architect-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
  architect_mysql_data:
