services:
  mysql:
    image: mysql:8.0
    container_name: architect-mysql
    environment:
      MYSQL_DATABASE: architect
      MYSQL_USER: architect
      MYSQL_PASSWORD: architect_pass
      MYSQL_ROOT_PASSWORD: architect_root
    ports:
      - "3307:3306"
    volumes:
      - architect_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-parchitect_root"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: architect-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://architect:architect_pass@mysql:3306/architect?charset=utf8mb4
      ADMIN_EMAIL: admin@architect.local
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: python scripts/docker_start.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: architect-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
  architect_mysql_data:
