    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const cursor = document.querySelector('[data-composition-id="scene2-upload"] .virtual-cursor');
        const fileDropContainer = document.querySelector('[data-composition-id="scene2-upload"] .file-drop-container');
        const attachChipBar = document.querySelector('[data-composition-id="scene2-upload"] .attachment-chip-bar');
        const sendBtn = document.querySelector('[data-composition-id="scene2-upload"] .send-btn');
        const userMsg = document.querySelector('[data-composition-id="scene2-upload"] .user-message-bubble');
        const composerPill = document.querySelector('[data-composition-id="scene2-upload"] .composer-pill');

        // 0.0s: State entry
        tl.fromTo('[data-composition-id="scene2-upload"] .studio-screen', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);

        // 0.2s: File card glides into the drop zone
        tl.fromTo(fileDropContainer, 
          { y: -40, opacity: 0, scale: 0.9 }, 
          { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, 
          0.2
        );

        // 1.0s: Cursor moves to file card
        tl.to(cursor, { x: 50, y: -200, duration: 0.6, ease: "power2.out" }, 0.6);

        // 1.5s: File card converts into the composer attach chip
        tl.to(fileDropContainer, { y: 250, scale: 0.5, opacity: 0, duration: 0.5, ease: "power3.in" }, 1.4);
        tl.fromTo(attachChipBar, 
          { scale: 0.8, opacity: 0, y: 15 }, 
          { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 
          1.8
        );

        // 2.0s: Send button pulses with glowing ready state
        tl.fromTo(sendBtn, 
          { scale: 1 }, 
          { scale: 1.15, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" }, 
          2.0
        );

        // 2.3s: Cursor moves to send button and clicks
        tl.to(cursor, { x: 380, y: 390, duration: 0.6, ease: "power2.inOut" }, 2.1);
        tl.to(sendBtn, { scale: 0.9, duration: 0.15 }, 2.7);
        tl.to(sendBtn, { scale: 1.0, duration: 0.15 }, 2.85);

        // 2.9s: Message sent! Input clears, message bubble launches into chat
        tl.to(attachChipBar, { opacity: 0, y: -20, duration: 0.3 }, 2.9);
        tl.to('[data-composition-id="scene2-upload"] .typed-text', { opacity: 0, duration: 0.2 }, 2.9);
        tl.fromTo(userMsg, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 3.0);

        // 3.6s: Outro transition
        tl.to('[data-composition-id="scene2-upload"] .studio-screen', { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene2-upload"] = tl;
      })();
