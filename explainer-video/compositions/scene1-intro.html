    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const logoBox = document.querySelector('[data-composition-id="scene1-intro"] .logo-box');
        const strokeBox = document.querySelector('[data-composition-id="scene1-intro"] .select-stroke-box');
        const eyebrow = document.querySelector('[data-composition-id="scene1-intro"] .intro-eyebrow');
        const title = document.querySelector('[data-composition-id="scene1-intro"] .intro-title');
        const subtitle = document.querySelector('[data-composition-id="scene1-intro"] .intro-subtitle');
        const badge = document.querySelector('[data-composition-id="scene1-intro"] .step-indicator');

        tl.fromTo(strokeBox, { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.fromTo(logoBox, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.2);
        tl.fromTo(eyebrow, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.fromTo(title, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.8);
        tl.fromTo(subtitle, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.0);
        tl.fromTo(badge, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.3);

        // Outro transition
        tl.to('[data-composition-id="scene1-intro"] .intro-content', { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 3.1);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-intro"] = tl;
      })();
