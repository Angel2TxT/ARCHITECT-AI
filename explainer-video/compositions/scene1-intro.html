    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const cursor = document.querySelector('[data-composition-id="scene1-intro"] .virtual-cursor');
        const typedTextEl = document.querySelector('[data-composition-id="scene1-intro"] .typed-text');
        const placeholder = document.querySelector('[data-composition-id="scene1-intro"] .placeholder-text');
        const sendBtn = document.querySelector('[data-composition-id="scene1-intro"] .send-btn');
        const composerPill = document.querySelector('[data-composition-id="scene1-intro"] .composer-pill');

        const fullPrompt = "Revisa este plano: verifica accesos, ventilación en baños y áreas mínimas.";

        // 0.0s: Base scene reveal
        tl.fromTo('[data-composition-id="scene1-intro"] .studio-screen', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

        // 0.4s: Cursor glides towards the input box
        tl.to(cursor, { x: -60, y: 550, duration: 1.0, ease: "power3.inOut" }, 0.4);

        // 1.3s: Focus on input: placeholder fades, caret appears
        tl.to(placeholder, { opacity: 0, duration: 0.2 }, 1.3);
        tl.to(composerPill, { borderColor: "rgba(0, 242, 254, 0.45)", boxShadow: "0 12px 36px rgba(0, 242, 254, 0.15)", duration: 0.3 }, 1.3);

        // 1.4s - 3.1s: Realistic typing effect
        const obj = { len: 0 };
        tl.to(obj, {
          len: fullPrompt.length,
          duration: 1.7,
          ease: "none",
          onUpdate: function () {
            typedTextEl.textContent = fullPrompt.substring(0, Math.round(obj.len));
          }
        }, 1.4);

        // 3.1s: Send button wakes up slightly, cursor moves toward attach button
        tl.to(cursor, { x: -440, y: 550, duration: 0.5, ease: "power2.out" }, 3.2);

        // Outro transition: smooth pan
        tl.to('[data-composition-id="scene1-intro"] .studio-screen', { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-intro"] = tl;
